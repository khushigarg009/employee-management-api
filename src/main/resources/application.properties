spring.application.name=employees
springdoc.swagger-ui.path = /docs

# H2 Database Configurations
spring.datasource.url = jdbc:h2:file:./data/employeedb;AUTO_SERVER=TRUE
spring.datasource.driverClassName = org.h2.Driver
spring.datasource.username = sa
spring.datasource.password = password
spring.jpa.database-platform = org.hibernate.dialect.H2Dialect

# H2 Console Configurations
spring.h2.console.enabled = true
spring.h2.console.path = /h2-console
spring.jpa.hibernate.ddl-auto = update


#Simple spring security
spring.security.user.name = ${ADMIN_USERNAME:admin}
spring.security.user.password = ${ADMIN_PASSWORD:change-me}

